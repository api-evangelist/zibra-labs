name: Zibra Labs
description: >-
  Zibra Labs is a Y Combinator (Spring 2026) startup building distributed
  compute infrastructure for AI workloads at scale. The platform gives teams
  access to the cheapest CPUs and GPUs across hyperscalers and neoclouds,
  orchestrating clusters of 100 to 50,000 mixed hardware nodes with sub-50ms
  task-dispatch overhead and millions of parallel tasks on spot instances across
  regions. Target workloads include quantitative-trading backtesting and
  parameter sweeps, AI post-training and reinforcement-learning pipelines,
  multi-modal data processing, batch and high-volume inference, and long-horizon
  agentic workflows. The founding team previously built three LinkedIn databases
  (Venice, Liquid, Espresso) and were tech leads on the open-source Ray compute
  framework. As of this profile Zibra Labs publishes only a corporate marketing
  site; no public API, developer documentation, or SDKs are available yet.
